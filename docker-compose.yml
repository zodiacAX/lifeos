services:
  lifeos:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////app/data/lifeos.db
      JWT_SECRET: change-this-to-a-long-random-production-secret
      COOKIE_SECURE: "false"
      FRONTEND_ORIGIN: http://localhost:8000
    volumes:
      - ./data:/app/data
